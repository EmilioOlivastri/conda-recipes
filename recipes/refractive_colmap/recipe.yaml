# Prioritize gpu build if cudatoolkit can be installed (through __cuda virtual package)
schema_version: 1

context:
  name: refractive_colmap
  version: "3.9.0"
  build_number: 0

  cuda: ${{ "enabled" if cuda_compiler_version != "None" else "disabled" }}
  cuda_build_string: cuda_${{ cuda_compiler_version | version_to_buildstring }}
  string_prefix: ${{ cuda_build_string if cuda ==  "enabled" else "cpu_" }}

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  - git: https://cau-git.rz.uni-kiel.de/inf-ag-koeser/colmap_underwater.git
    rev: 5b73ae1a61856c4e712908a353c951a1ba2bc748

build:
  number: ${{ build_number }}
  string: ${{ string_prefix }}h${{ hash }}_${{ build_number }}
  variant:
    use_keys:
      # use cuda from the variant config, e.g. to build multiple CUDA variants
      - ${{ "cuda" if cuda == "enabled" }}
    # this will down-prioritize the cpu variant versus other variants of the package
    down_prioritize_variant: ${{ 0 if cuda == "enabled" else 1 }}
  script:
    file: build
    env:
      package_version: ${{ version }}

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - if: cuda == "enabled"
      then: cuda-nvcc
    - cmake
    - make
    - pkg-config
    - ninja
    - libgomp
  host:
    - xorg-libxext
    - xorg-libxdmcp
    - xorg-libxau
    - libxcb
    - xorg-libxfixes
    - xorg-libxrender
    - xorg-libx11
    - xorg-libice
    - xorg-libsm
    - libglu
    - libgl-devel
    - libopengl-devel
    - libblas
    - libcblas
    - libboost-devel
    - suitesparse
    - eigen
    - eigen-abi-devel
    - freeimage
    - glog
    - gflags
    - glew
    - cgal-cpp
    - ceres-solver
    - qt-main
    - git
    - flann
    - sqlite
    - vlfeat
    - gmp
    - lz4-c
    - metis
    - openimageio
    - poselib
    - faiss
    - if: cuda == "enabled"
      then:
        - cuda-cudart
        - libcurand-dev
        - cuda-cudart-dev
        - cuda-version ==${{ cuda_compiler_version }}
        - faiss-gpu
    - libgomp
  run:
    - flann
    - if: cuda == "enabled"
      then:
        - __cuda >=${{ cuda_compiler_version }}  # needed to ensure cuda packages are only installed in cuda environments and fallback to cpu builds otherwise
    - xorg-libxext
    - xorg-libxdmcp
    - xorg-libxau
    - libxcb
    - xorg-libxfixes
    - xorg-libxrender
    - xorg-libx11
    - xorg-libice
    - xorg-libsm
    - vlfeat
    - libglu
  run_exports:
    - ${{ pin_subpackage('refractive_colmap', upper_bound='x.x') }}

tests:
  - script:
      - test -f $PREFIX/bin/colmap
      - test -f $PREFIX/lib/libcolmap_exe.a
      - test -f $PREFIX/share/colmap/colmap-config.cmake
      - if: cuda == "enabled"
        then: test -f $PREFIX/lib/libcolmap_util_cuda.a

about:
  license: BSD-3-Clause
  license_file:
    - COPYING.txt
    - src/thirdparty/LSD/LICENSE
    - src/thirdparty/PoissonRecon/LICENSE
    - src/thirdparty/SiftGPU/LICENSE
    - src/thirdparty/VLFeat/LICENSE
  summary: This project extends COLMAP to support Refractive Structure-from-Motion (RSfM) when utilizing cameras underwater with waterproof housings, including both flat-ports and dome-ports.
  homepage: https://cau-git.rz.uni-kiel.de/inf-ag-koeser/colmap_underwater

extra:
  recipe-maintainers:
    - EmilioOlivastri 