[workspace]
authors = ["EmilioOlivastri <emilio.olivastri@gmail.com>"]
channels = ["conda-forge"]
name = "conda-recipes"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
update_recipe = "python3 update_sha256.py"
upload = "binstar upload -u nmarticorena " # TO BE UPDATED WITH YOUR ANACONDA USERNAME

[tasks.build]
cmd = "rattler-build build --recipe-dir ./recipes/{{ name }} -m ./recipes/{{ name }}/variant_configuration.yaml --skip-existing"
description = "Build a single package from the recipes directory. Usage: pixi build_one --name <package_name>"
args = [{"arg" = "name"}]

[dependencies]
rattler-build = ">=0.55.1,<0.56"
anaconda-client = ">=1.14.1,<2"
